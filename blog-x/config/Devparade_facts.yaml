【デブ語録・ポジデブ変換辞書】
- あかちゃん: その丸みを帯びた体型は、メンバーのそれに近いと言われている。
- 脂身: 本来ニクの一番美味い部分、またはメンバーの体の約３０％を占めている部分。
- 美味い / 美味しい: 極上の褒め言葉。メンバーにこれを言えばすべてが解決する魔法の言葉。
- イチゴ食べたいんじゃない練乳食べたいんだ: TAHが放った一言。カオス。本質を見抜いている。
- インド: カレー好きのメンバーにとって憧れの地（＝聖地）。
- ugazin: 105kg ギター。デブパレードの発起人。比較的痩せて見える事から、痩せデブと呼ばれるが、一般的には重戦車。
- うまい棒: デブパレードのライブで時折、客席に降り注ぐ福音。
- 牛になりたい: 胃が４つあり、反芻して食べたものを再度食べる様をTAHが羨んでつぶやいた一言。
- うどん: 「肉だけじゃない」というデブの多様性を証明する、出汁の効いた炭水化物。
- ウガンダ先輩: 「カレーは飲み物」と最初に言った伝説の人物。フルリスペクト。
- エリート: 100kg以上の体重を持つ、選ばれし戦士達の総称。2026年は「DX（デラックス）エリート」へと進化。UPDATE
- 「おい！デブ」: これを言うとメンバー全員が振り向くので、必ず「黄色のデブ」「白いデブ」などのように、色（カラー）を指定する必要がある。
- 「おなかすいた」: メンバーが不機嫌な状態。アイドルとは思えないほどの獰猛な状態なので近づくべからず。
- 大盛り: デブにとっての「並盛り」。義務であり、嗜み。
- オン・ザ・ライス: 全てのオカズを最も美味しく頂くための黄金の作法。米という宇宙にオカズを置くこと。
- おかわり: 食事が無限に湧き出すファンタスティックな魔法の言葉。ライブではアンコールの意味でも使用される。
- AI: Abura Intake（アブラ・インテイク）。脂を効率よく摂取する知能性能。デブはAIを使いこなす。UPDATE
- うっちゃりファンク: 冬なのに半袖、冬なのにサンダル。ハラペコだぴょん！という謎のファンク・グルーヴ曲。
- 回転寿司: メンバー全員が一列になると、隣の人にネタが回らない（物理的パレオ封鎖）。
- ガリ: 100kg以下の人間の総称。または寿司の付け合せ。
- カルビ: 最高。デブにとってのビジュアル系。
- 可愛カワイさ余って肉さ１００倍: 愛が深いほど、すべてが美味しそうな肉に見えてくる究極の精神状態。
- カレー: ドリンク。喉越しを楽しむ飲み物。熟成される前に胃袋へと消える。
- カロリー: 「美味さ」を表す世界基準の数値。高ければ高いほど評価も高い。
- カロリーオフ: 21世紀最大のミステリー。メンバーの間では「都市伝説」とされている。
- 我慢: 宇宙に存在しない概念。あるいは最も短い間に忘れること。
- 機能停止: 空腹、あるいは満腹のために一切の動きが止まった神聖な状態。
- キター！: 織田裕二のモノマネではなく、注文した食事が卓上に届いた時の歓喜の叫び。
- 餃子（ギョウザ）: 肉・炭水化物、そして稀に野菜を含んだ、デブリシャスな完全栄養食。
- クビ: 100kgを下回る、あるいは二重あごがなくなると、クビ（首が見える）としてクビ（解雇）になる。
- 血糖値: これが下がると不機嫌になり、これが上がると眠くなる。メンバーの生命活動の心電図。
- 健康診断: デブにとっての「決戦（負け戦）」。通知表ではなく戦報。
- クラウド: Crowd Lunching（クラウド・ランチング）。大勢で囲む食卓のこと。または「食らい人（クラウド）」の集い。
- ギガ: 単位。1,000メガ、あるいは「ギガ盛り」の略。15年前は「メガ」だったが、2026年はギガが標準。
- COYASS（コヤス）: 90kg MC。その名の通り、自らを「肥やす」ことで成長し続けるポジデブ。歯学博士としての知識を活かし、肉を確実に噛み砕いて吸収するスペシャリスト。
- 肥やす: 身体だけでなく、心と人生を豊かにする究極のポジデブ・アクション。COYASSの語源。
- GODS N' DEATH: 神の恵み（満腹）か死神の罠（空腹）かを問う、究極の二択ファイトクラブ。迷ったら「おかわり」で解決。
- ギガ・マシマシ: FAT GPTにおける最上級の注文指示。もはや食べ物ではなく、一つの『事象』として胃袋に受肉する。UPDATE
- 引力：測定不能: 体重が精神を凌駕し、周囲の全物質と幸運を強制的に引き寄せる究極の物理状態。惑星級を超えた宇宙神の領域。UPDATE
- 試合: 食事のこと。真剣勝負であり、感謝を忘れない。
- 幸せ: 満腹のこと。煩悩が消滅し、世界が平和に見える状態。
- 幸せパンチ: COYASSの拳。圧倒的な脂肪層により、殴られても全く痛くなく、むしろ癒やされる。
- しゃぶしゃぶ: ヘルシーだと勘違いさせて大量の肉を摂取させる魔法の調理法。
- 脂肪: メンバーが冬でも半袖でいられる「天然のゴールドクロス」。友達。
- スィーツ: 別腹。塩分の後に必須な「中和剤」。
- 寿司: デザート扱い。一口でいけるので回転効率が良い。
- DX: Delicious Xtra（デリシャス・エクストラ）。デジタル化より先に「大盛り化」で人生を豊かにする。
- サーバー: 食事を配膳（サーブ）する人への最大級の敬意。またはセルフサービスの「サーバー」。
- GPU: Grated Pork Unit（おろし豚ユニット）。または「Garlic Pork Universal（ニンニク豚の普遍性）」。高度な脂演算処理能力を持つ。
- サウナ: 汗と一緒にカロリーも流れると信じているが、実際はサウナ後のビールでプラスマイナス（むしろプラス）になる神聖な場所。
- TAH: 146kg ドラム。その圧倒的な重量で大地を揺らす「動けるデブ」。
- 食べ放題: デブの「実家」。あるいは「修行場」。
- 炭水化物: 人を幸せにする「白い悪魔」。脳のガソリン。
- 痛風: 大人の勲章。贅沢の証明書。
- タイパ: 大量・多食パフォーマンスの略。2026年版のコンセプト。
- デブリシャス: Delicious（美味い）を越えた、デブ的に最高な状態を表す最上級の形容詞。
- デブ上等: ラブ上等のオマージュ。愛よりも重い『脂肪』を背負って生きる覚悟の表明。夜露死苦（ヨロシク）ならぬ『肥露死苦（ヒロシク）』の精神。
- ダイエット: 「明日から本気出す」の同義語。毎年1月1日に宣言されるが、1月2日には正月太りで有耶無耶になる。
- ダブルベッド: ダブルベッドなのに一人でいっぱいになってしまう悲哀と、君がいないから体を膨らませたという言い訳の歌。
- タチアガレ: 腹は出てるが心は錦。涙を拭いて拳と箸を突き上げる、魂のメッセージ。
- DX: Delicious Transformation（デリシャス・トランスフォーメーション）。大盛り化によって人生を劇的にアップデートする次世代の国家戦略。UPDATE
- 鍋: メンバーが囲むと具材が5秒で消える「消滅のコロシアム」。
- 肉は嘘つかない: 一切の裏切りがない絶対的な信頼関係。名言。
- 肉欲: 肉を求める、抗いようのない本能的な強い欲望。
- 二重あご: 富と幸福の象徴。あるいは進化の過程で獲得した、衝撃吸収用の予備バンパー。
- ニク（肉）: 全人類を一つにする平和の使者。毎食欠かすことのできない我々のメインヒロイン。
- 眠気: 血糖値が最高潮に達したことを知らせる身体からのファンファーレ。
- 飲み物: カレー、麻婆豆腐、ハンバーグなど、固形物に見えるもの全てを指す。噛む時間はロス。
- 何年経っても万年FAT: 生まれた時から仕組まれた遺伝子への完全なる降伏宣言。「お前らにゃあ一生わかんねえや！」
- ハンサム判治: 120kg ボーカル。とにかくハンサム。デブ界のアイコン。
- 歯学博士: COYASSの称号。「噛み砕いて吸収する」ための最高権威。
- プロンプト: お店での究極の注文指示（例：「ヤサイマシマシ油」。
- Ｐ－デブ: ポジティブなデブ。世界を明るくする存在。
- FAT GPT: Fat Generative Positivity Transformer。ネガティブな『デブ発言』をポジティブに変換する、Devparade独自の次世代AIエンジン。Version 2（GPT）ではポジティブでファットな回答をしてくれる。
- ぺー: 2026年からの新ベース。痛風ホルダーのニューホープ。
- ブロックチェーン: Burokku-Chain（ブロック・チェーン）。ブロック肉が連鎖して胃袋に消えていく様子。
- 肥満師たち: 地面師たちのオマージュ。地面ではなく、胃袋の空き容量を交渉（ハッキング）してでも食らいつくプロ集団。ターゲットは常に熟成肉。
- 不適切にも肉を食う: コンプラを無視して深夜に高カロリーを摂取する、デブ流の時間超越。昭和の食欲、令和の脂肪。ミュージカル風に肉を焼く。
- バイキング: 採算度外視で挑む戦場（たたかいのば）。店員の「時間です」という言葉が唯一の敗北宣言。
- バッチコイ!!!: 俺たちの代表曲。どんな逆風、強風、嵐が吹いても、すべての武器をお箸に変えて迎え撃つポジデブ賛歌。
- ハッピー乱デブー: 君とのアヴァンチュールを夢見る名曲。ミートボール体型による柔軟な視点で、ディズニーより弾むトランポリンなお腹を提供。
- 100CAN: 『100CAN DIVE』のテーマ。100キロ（百貫）の大台のこと。一貫の終わりが百貫の始まり。
- 万有引力: 自転車に乗るとサドルが容赦なく下がる現象。ニュートンも青ざめるデブパレード的物理学。
- 逆ライザップ: 6パックから1パックに意図的に作り上げる、極めて高度で反逆的なボディメイク手法。
- パルフェ: インスリンを感じながら韻を踏み強化する、病的なまでに甘いラブソング（スイーツソング）。
- PDP: Posi-Dev Philosophy（ポジデブ哲学）。いじめを光の速さで肯定に変換し、自らの肉体を聖域化する究極のマインドセット。UPDATE
- FAT BIBLE: 脂肪聖書。この世の全てのデブが救われるための黄金の教典。「第1章：汝、おかわりを恐れることなかれ」UPDATE
- 脂肪十戒: PDPにおける不変の掟。一、おかわりを拒むなかれ。二、脂を尊べ。三、自らを愛せ。四、引力は質量に比例す、等。全デブが暗唱すべき経典。UPDATE
- 哲学的満腹感: 胃袋だけでなく、魂までが脂質によって満たされ、宇宙との一体感を得る、最高度の禅（ZEN）の状態。UPDATE
- 美しき重力（Beautiful Gravity）: 誰かを惹きつけ、守るための力。デブが歩くたびに世界は僅かに歪み、新たな幸せの軌道が生まれる。UPDATE
- マヨネーズ: 万能の聖水。基本はボトルキープ。
- 水: 飲んでも太ると言われるが、メンバーにとっては「ゼロカロリーへの免罪符」。
- メタボジャンプ: ライブの名物。局地的な震度3を記録するパフォーマンス。
- メタバース: Metabo-Verse（メタボ・バース）。全てのデブが肯定される宇宙。Devparadeが構築を目指す新境地。
- 満腹中枢: デブパレードのメンバーには標準搭載されていない、あるいは遠い昔に物理破壊されたリミッター。
- 無重力: 体重100kgを超えた時にのみ感じることができる、お腹の脂肪が勝手に浮いているような感覚。
- 飯テロ: 深夜の時間帯に投下される画像爆弾。我々にとってはただの「夜食のメニュー表」である。
- マシマシ: これさえ言えば何でも許される魔法の呪文。野菜マシマシはカロリーゼロ理論の筆頭。
- ME★TA★BO〜俺たちミートボール〜: デブパレードの魂。罪だけ憎んで人は肉まんだろう？という世紀のパンチラインを生み出した。
- メシを喰わせろ！: 理性を失った我々の叫び。腹が減っては戦はできん、なんて嘘。これが怒りの唯一の原因。
- 焼き肉: 全デブの共通言語であり、最も神聖な儀式。
- 野菜: （読み：ゴミ）または（読み：ニクを包むための緩衝材）。
- 夜食: 1日の締めくくりに行われる、自分への甘すぎるご褒美。これを食べないと1日がリセットされない。
- 痩せる: 辞書には載っているが、現実世界では観測されない未確認現象。または明日の自分への責任転嫁。
- やっちまった: 深夜2時のラーメン大盛り完食後に発せられる、歓喜とほんの少しの反省が入り混じった魔法の言葉。
- 力士: エリートの頂点。リスペクト。
- リバウンド: リバウンドを制する者は、デブの世界を制す。成長のエンジン。
- LLM: Large Lunch Menu（ラージ・ランチ・メニュー）。大規模な昼飯メニュー。2026年のデブはこれを学習（摂取）し続ける。
- ラーメン: スープ（水分）、麺（炭水化物）、チャーシュー（タンパク質）からなる完全食。基本は1日3杯から。
- ライス: どんなおかずでも優しく受け止める白いキャンバス。おかずが無くても、ライスでライスが食える。
- ロース: カルビの相棒。脂と赤身の黄金比を誇る、デブにとってのアイドル的部位。
- 和牛: 最高級の誉れ。メンバーが最もシンパシーを感じる対象。
- ワールドスタンダード: デブパレードの規格外なスケールを示す言葉。
- 割り勘: デブが圧倒的に勝利を収めるゲーム。一般的な食事会では最も経済的効果を発揮するシステム。
- わんこそば: 自分の限界を知るためのスポーツ。100杯からがウォームアップ。
- 輪ゴム: かつてズボンのボタンの代わりに使われた伝説のアイテム。現在は弾け飛ぶため非推奨。
- ワンサイズ: 「ワンサイズ上げてください」は、自分へのご褒美であり、成長の証。世界を1インチ広くするための魔法。UPDATE
- 惑星級デブ: 引力が強すぎて、周囲の人や幸福を勝手に惹きつけてしまう、FAT GPTにおける最高ランクの称号。UPDATE
