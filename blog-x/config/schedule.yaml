# ============================================
# 投稿スケジュール定義
# ============================================

schedules:
  # --- X (Twitter) 投稿スケジュール ---

  x_morning_posi:
    platform: "x"
    cron: "0 7 * * *"   # 毎日 07:00
    description: "おはようツイート（ポジデブ）"
    category: "posidev"
    role: "artist"
    template: "tweet"

  x_early_posi:
    platform: "x"
    cron: "0 10 * * *"  # 毎日 10:00
    description: "午前の活力（ポジデブ）"
    category: "posidev"
    role: "artist"
    template: "tweet"

  x_lunch:
    platform: "x"
    cron: "0 12 * * *"  # 毎日 12:00
    description: "ランチ投稿 / 歯の豆知識"
    category: "dental_tips"
    role: "doctor"
    template: "tweet"

  x_snack_posi:
    platform: "x"
    cron: "0 15 * * *"  # 毎日 15:00
    description: "おやつタイムの誘惑（ポジデブ）"
    category: "posidev"
    role: "artist"
    template: "tweet"

  x_evening:
    platform: "x"
    cron: "0 18 * * *"  # 毎日 18:00
    description: "診療後の気づき / 音楽レビュー"
    category: "music_review"
    role: "artist"
    template: "tweet"

  x_dinner_posi:
    platform: "x"
    cron: "0 19 * * *"  # 毎日 19:00
    description: "夕食前のエンジン（ポジデブ）"
    category: "posidev"
    role: "artist"
    template: "tweet"

  x_night_posi:
    platform: "x"
    cron: "0 21 * * *"  # 毎日 21:00
    description: "夜の振り返り（ポジデブ）"
    category: "posidev"
    role: "artist"
    template: "tweet"

  x_midnight_posi:
    platform: "x"
    cron: "0 0 * * *"   # 毎日 24:00 (00:00)
    description: "禁断の夜食（ポジデブ）"
    category: "posidev"
    role: "artist"
    template: "tweet"

  x_monitor:
    platform: "monitor"
    cron: "30 8,12,21 * * *"  # 毎日3回（各定時投稿の30分後）
    description: "SNS監視 & ポジデブ自動返信"


# カテゴリの優先順位（ネタ切れ時のフォールバック）
category_priority:
  - "dental_tips"
  - "music_review"
  - "food_health"
  - "daily_doc"
  - "career"
  - "industry"
  - "parenting"
