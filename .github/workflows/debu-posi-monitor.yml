name: PosiDev Monitor - 無料検索 & メンション監視 & ポジデブ自動返信

on:
  schedule:
    # ピーク時間の30分後に監視（投稿後の反応をチェック）
    - cron: '0 23 * * *'   # 朝 8:00 JST
    - cron: '30 3 * * *'   # 昼 12:30 JST
    - cron: '0 12 * * *'   # 夜 21:00 JST
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install tweepy requests beautifulsoup4

      - name: Search & auto-reply (Free method)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/debu-posi-search-free.py

      - name: Commit and Push state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json data/*.txt || true
          git commit -m "🤖 [skip ci] Update PosiDev monitor state" || echo "No changes to commit"
          git push

      - name: Create Issue report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f search_report.md ]; then
            DATE=$(date +%Y-%m-%d_%H%M)
            gh issue create \
              --title "🍖 [ポジデブ返信] ${DATE}" \
              --body "$(cat search_report.md)" \
              --label "debu-posi-reply" || true
          fi
