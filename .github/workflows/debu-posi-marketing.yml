name: PosiDev Daily Tweet - 1日4回ポジデブ自動投稿

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: 'キャンペーン名 (launch / scheduled / collab)'
        required: false
        default: 'scheduled'
  schedule:
    # X閲覧ピーク時間に1日4回投稿（JST）
    - cron: '30 22 * * *'  # 朝 7:30 JST（通勤ラッシュ）
    - cron: '0 3 * * *'    # 昼 12:00 JST（ランチタイム）
    - cron: '0 8 * * *'    # 夕方 17:00 JST（帰宅ラッシュ）
    - cron: '30 11 * * *'  # 夜 20:30 JST（ゴールデンタイム）

permissions:
  issues: write
  contents: write

jobs:
  daily-tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install tweepy

      - name: Generate and auto-post tweet
        env:
          CAMPAIGN: ${{ github.event.inputs.campaign || 'scheduled' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/debu-posi-tweet-generator.py

      - name: Commit and Push state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json data/*.txt || true
          git commit -m "🤖 [skip ci] Update PosiDev state" || echo "No changes to commit"
          git push

      - name: Create Issue log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f tweet_issue.md ]; then
            DATE=$(date +%Y-%m-%d_%H%M)
            gh issue create \
              --title "🍖 [ポジデブ日報] ${DATE}" \
              --body "$(cat tweet_issue.md)" \
              --label "tweet-ready" || true
          fi
